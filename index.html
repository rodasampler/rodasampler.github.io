<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rodasampler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0e0e0e;
      color: #f2f2f2;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
    }

    /* DRAGÓN DE FONDO MUY SUAVE */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("dragon.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 0.06; /* 👈 ajustá esto: 0.03 a 0.12 aprox */
      pointer-events: none;
      z-index: 0;
    }

    /* TODO EL CONTENIDO ENCIMA */
    header, section {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
    }

    h1, h2 {
      letter-spacing: 1px;
    }

    hr {
      border: none;
      border-top: 1px solid #333;
      margin: 40px 0;
    }

    a {
      color: #8ad1ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    iframe {
      width: 100%;
      height: 315px;
      border: none;
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <header>
    <h1>RODASAMPLER</h1>
    <h2>Laboratorio sonoro</h2>
  </header>

</body>
</html>
