<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rodasampler</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0e0e0e;
      color: #f2f2f2;
      line-height: 1.6;
    }

    /* DRAGÓN DE FONDO (NO TOCA TU CONTENIDO) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("dragon.png") center/contain no-repeat;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
    }

    /* ASEGURA QUE TODO TU CONTENIDO ESTÉ ENCIMA */
    header, section, div, h1, h2, p, a, img {
      position: relative;
      z-index: 1;
    }

    header, section {
      max-width: 800px;
      margin: auto;
      padding: 40px 20px;
    }

    h1, h2 {
      letter-spacing: 1px;
    }

    hr {
      border: none;
      border-top: 1px solid #333;
      margin: 40px 0;
    }

    a {
      color: #8ad1ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    iframe {
      width: 100%;
      height: 315px;
      border: none;
    }
  </style>
</head>

<body>

<!-- TU CONTENIDO VA EXACTAMENTE COMO LO TENÉS -->
<header>
  <h1>RODASAMPLER</h1>
  <h2>Laboratorio sonoro</h2>
</header>

<section>

    Ser parte del sonido.
  </p>
</section>

</html>
